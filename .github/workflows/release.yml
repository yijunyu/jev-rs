name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: release tag to attach binaries to
        default: v0.1.0

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-14
            target: x86_64-apple-darwin
            cross: true
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - run: cargo test --release --locked --target ${{ matrix.target }}
        if: ${{ !matrix.cross }}
      - name: package
        run: |
          set -e
          name=jev-${{ matrix.target }}
          mkdir -p dist/$name
          cp target/${{ matrix.target }}/release/jev dist/$name/
          cp README.md LICENSE-MIT LICENSE-APACHE dist/$name/
          tar -C dist -czf dist/$name.tar.gz $name
          (cd dist && shasum -a 256 $name.tar.gz > $name.tar.gz.sha256)
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            dist/*.tar.gz
            dist/*.sha256

  ci:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: history carries only human authors and committers
        run: |
          set -e
          bad='claude|anthropic|copilot|openai|codex|gemini'
          if git log --format='%an <%ae> %cn <%ce>' | grep -iE "$bad"; then
            echo "::error::AI identity found as author/committer"; exit 1; fi
          if git log --format='%B' | grep -iE "^(Co-Authored-By|Signed-off-by):.*($bad)|Generated with \[?Claude Code|🤖"; then
            echo "::error::AI attribution trailer found in a commit message"; exit 1; fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --lib --no-default-features
      - name: in-process llama.cpp backend (CPU) compiles
        run: cargo build --features llamacpp
