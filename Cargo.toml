[package]
name = "jev-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT OR Apache-2.0"
description = "System One judgments (noul / choice / score) from any LLM in one prefill — a Rust, Jev-compatible /v1/systemone engine"
repository = "https://github.com/yijunyu/jev-rs"
readme = "README.md"
keywords = ["llm", "classification", "calibration", "system-one", "jev"]
categories = ["science", "web-programming::http-server"]
exclude = [".github/", ".githooks/", "CLAUDE.md", "install.sh", "docs/"]

[lib]
name = "jev_rs"
path = "src/lib.rs"

[[bin]]
name = "jev"
path = "src/main.rs"
# The command line drives every backend and the server, so it needs them all.
# An embedder takes the library with --no-default-features instead.
required-features = ["cli", "serve", "http-backends"]

[features]
# Everything, so `cargo build` and `cargo install` are unchanged.
default = ["cli", "serve", "http-backends", "preserve-order"]
# The `jev` command line.
cli = ["dep:clap"]
# `jev serve`, the Jev-compatible HTTP server.
serve = ["dep:tiny_http"]
# The backends that reach a model over HTTP: llama-server, an
# OpenAI-compatible server, and hosted Jev.
http-backends = ["dep:ureq"]
# Keep JSON object key order in requests and answers (pulls `indexmap`).
# Choice-option order never depends on it: see `protocol::OrderedCriteria`.
preserve-order = ["serde_json/preserve_order"]
# In-process llama.cpp: load a GGUF into this process, no server. Builds
# llama.cpp from source (cmake). `llamacpp-metal` adds the Apple GPU backend.
llamacpp = ["dep:llama-cpp-2"]
llamacpp-metal = ["llamacpp", "llama-cpp-2/metal"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
ureq = { version = "2", features = ["json"], optional = true }
clap = { version = "4", features = ["derive", "env"], optional = true }
tiny_http = { version = "0.12", optional = true }
llama-cpp-2 = { version = "0.1.156", optional = true }

[profile.release]
opt-level = 3
lto = "thin"
