[package]
name = "jev-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT OR Apache-2.0"
description = "System One judgments (noul / choice / score) from any LLM in one prefill — a Rust, Jev-compatible /v1/systemone engine"
repository = "https://github.com/yijunyu/jev-rs"
readme = "README.md"
keywords = ["llm", "classification", "calibration", "system-one", "jev"]
categories = ["science", "web-programming::http-server"]

[lib]
name = "jev_rs"
path = "src/lib.rs"

[[bin]]
name = "jev"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
ureq = { version = "2", features = ["json"] }
clap = { version = "4", features = ["derive", "env"] }
tiny_http = "0.12"
thiserror = "1"

[profile.release]
opt-level = 3
lto = "thin"
